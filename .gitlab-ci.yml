workflow:
  rules:
    - if: $CI_COMMIT_BRANCH

stages:
  - validate
  - plan
  - apply

variables:
  ARTIFACT_REGISTRY: $GRP_KO_VAR_ARTIFACT_REGISTRY
  CI_IMAGES_REF: $GRP_KO_VAR_CI_IMAGES_REF
  PROSE_ASSETS_REF: $GRP_KO_VAR_PROSE_ASSETS_REF
  PROSE_SPEC_REF: $GRP_KO_VAR_PROSE_SPEC_REF
  CI_IMAGE: $ARTIFACT_REGISTRY/ci-linux:$CI_IMAGES_REF
  TF_IN_AUTOMATION: "true"
  GITLAB_TOKEN: $REPO_VAR_GITLAB_TOKEN
  TF_VAR_github_token: $REPO_VAR_GITHUB_TOKEN
  TF_VAR_ci_gitlab_token: $REPO_VAR_GITLAB_TOKEN
  TF_VAR_ci_google_credentials: $REPO_VAR_GOOGLE_CREDENTIALS
  TF_VAR_op_service_account_token: $REPO_VAR_OP_SERVICE_ACCOUNT_TOKEN
  TF_VAR_gcp_billing_account: $REPO_VAR_GCP_BILLING_ACCOUNT
  GOOGLE_CREDENTIALS: $REPO_VAR_GOOGLE_CREDENTIALS
  GOOGLE_APPLICATION_CREDENTIALS: /tmp/gcp-sa-key.json

default:
  retry:
    max: 2
    when:
      - runner_system_failure
      - api_failure
      - stuck_or_timeout_failure
      - scheduler_failure
      - unknown_failure
  interruptible: true
  image: $CI_IMAGE
  tags:
    - gke-linux-amd64-small

.tf-creds:
  before_script:
    - printf '%s' "$GOOGLE_CREDENTIALS" | base64 -d > "$GOOGLE_APPLICATION_CREDENTIALS"
    - test -s "$GOOGLE_APPLICATION_CREDENTIALS" || { echo "decoded SA key is empty — check GOOGLE_CREDENTIALS var"; exit 1; }
    - unset GOOGLE_CREDENTIALS

validate-pre-commit-all:
  stage: validate
  rules:
    - if: $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH
  before_script:
    - export PROSE_ASSETS_REF=$(sed -n 's/^prose_assets_ref *= *"\(.*\)"/\1/p' tf/terraform.tfvars)
    - export PROSE_SPEC_REF=$(sed -n 's/^prose_spec_ref *= *"\(.*\)"/\1/p' tf/terraform.tfvars)
    - export MISC_REF=$(sed -n 's/^misc_ref *= *"\(.*\)"/\1/p' tf/terraform.tfvars)
  script:
    - make repo-ci-precommit-all
    - git diff --exit-code HEAD

plan:
  extends: .tf-creds
  stage: plan
  needs: []
  interruptible: false
  resource_group: terraform
  rules:
    - if: $CI_COMMIT_BRANCH
  script:
    - make plan
  artifacts:
    paths:
      - tf/plan.tfplan
    expire_in: 1 day

apply:
  extends: .tf-creds
  stage: apply
  needs:
    - plan
  interruptible: false
  resource_group: terraform
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - make apply
##[<] 🤖🤖
