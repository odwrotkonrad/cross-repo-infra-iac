#[why] branch pipelines only, no MR pipelines: every branch is a protected ref (branch_protection "*"), so protected vars flow to every pipeline and plan can run pre-merge; the MR widget shows the source branch pipeline
workflow:
  rules:
    - if: $CI_COMMIT_BRANCH

stages:
  - validate
  - plan
  - apply

variables:
  CI_IMAGE: registry.gitlab.com/konradodwrot/infra/oci-images/ci-linux:latest
  TF_IN_AUTOMATION: "true"
  GITLAB_TOKEN: $TF_GITLAB_TOKEN
  TF_VAR_github_token: $GITHUB_TOKEN
  TF_VAR_ci_gitlab_token: $TF_GITLAB_TOKEN
  TF_VAR_ci_google_credentials: $GOOGLE_CREDENTIALS
  GOOGLE_APPLICATION_CREDENTIALS: /tmp/gcp-sa-key.json

#[why] every job in this repo runs on the self-hosted GKE runners: no SaaS compute minutes remain.
#   set once here rather than per job, so a new job inherits it instead of silently going nowhere.
#   medium is the default size, matching the SaaS runner these replace; a job needing more overrides
#   this with its own tags
default:
  #[why] spot nodes are preempted mid-job and the manager itself runs on spot: infrastructure
  #   failures are expected, not exceptional. 2 is gitlab's hard maximum, so 3 attempts in total.
  #   retries cover runner and API faults only, never a failing script
  retry:
    max: 2
    when:
      - runner_system_failure
      - api_failure
      - stuck_or_timeout_failure
      - scheduler_failure
      - unknown_failure
  #[why] a superseded pipeline holds pods for a commit nobody will merge, so cancellable by default
  #   and the terraform jobs opt out individually: they hold a state lock, and killing one mid-run
  #   leaves it held with no owner, blocking every later pipeline until an operator force-unlocks it
  interruptible: true
  image: $CI_IMAGE
  tags:
    - gke-linux-amd64

#[why] the credential decode lives only in the tf jobs; with "*" branch protection every branch pipeline is a protected ref, so the protected applier vars are present
.tf-creds:
  before_script:
    - printf '%s' "$GOOGLE_CREDENTIALS" | base64 -d > "$GOOGLE_APPLICATION_CREDENTIALS"
    - test -s "$GOOGLE_APPLICATION_CREDENTIALS" || { echo "decoded SA key is empty — check GOOGLE_CREDENTIALS var"; exit 1; }
    - unset GOOGLE_CREDENTIALS

#[why] small: docs regeneration and a git diff need far less than a terraform run
validate-pre-commit-all:
  stage: validate
  tags:
    - gke-linux-amd64-small
  rules:
    - if: $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH
  variables:
    CHE_RENDER_TEMPLATES_SKIP_SECRETS: "true"
  script:
    - make repo-ci-precommit-all
    - git diff --exit-code HEAD

#[why] one job for every branch: apply consumes the artifact from the default-branch run, and a
#   branch run's copy simply expires unread. plan.tfplan embeds cleartext secrets (armored GPG key,
#   SA key) and is downloadable by any Reporter, so expire_in is kept short to bound that window:
#   before this merge only the default branch uploaded it, and branch runs kept log output only
#[why] not interruptible: terraform holds a lock on remote state, and a job killed mid-run leaves it
#   held with no owner, blocking every later pipeline until someone force-unlocks it by hand
plan:
  extends: .tf-creds
  stage: plan
  needs: []
  interruptible: false
  rules:
    - if: $CI_COMMIT_BRANCH
  script:
    - make plan
  artifacts:
    paths:
      - tf/plan.tfplan
    expire_in: 1 day

apply:
  extends: .tf-creds
  stage: apply
  needs:
    - plan
  interruptible: false
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - make apply
