include:
  - project: konradodwrot/cross-repo/misc
    ref: $GRP_KO_VAR_MISC_REF
    file: shared/ci/templates/TriggerAutomation.gitlab-ci.yml

workflow:
  rules:
    - if: $CI_COMMIT_BRANCH

stages:
  - release
  - validate
  - plan
  - apply
  - trigger

variables:
  ARTIFACT_REGISTRY: $GRP_KO_VAR_ARTIFACT_REGISTRY
  CI_IMAGES_REF: $GRP_KO_VAR_CI_IMAGES_REF
  PROSE_ASSETS_REF: $GRP_KO_VAR_PROSE_ASSETS_REF
  PROSE_SPEC_REF: $GRP_KO_VAR_PROSE_SPEC_REF
  CONFIGS_REF: $GRP_KO_VAR_CONFIGS_REF
  MISC_REF: $GRP_KO_VAR_MISC_REF
  CI_IMAGE: $ARTIFACT_REGISTRY/ci-linux:$CI_IMAGES_REF
  TF_IN_AUTOMATION: "true"
  GITLAB_TOKEN: $REPO_VAR_GITLAB_TOKEN
  TF_VAR_github_token: $REPO_VAR_GITHUB_TOKEN
  TF_VAR_ci_gitlab_token: $REPO_VAR_GITLAB_TOKEN
  TF_VAR_ci_google_credentials: $REPO_VAR_GOOGLE_CREDENTIALS
  TF_VAR_op_service_account_token: $REPO_VAR_OP_SERVICE_ACCOUNT_TOKEN
  TF_VAR_gcp_billing_account: $REPO_VAR_GCP_BILLING_ACCOUNT
  GOOGLE_CREDENTIALS: $REPO_VAR_GOOGLE_CREDENTIALS
  GOOGLE_APPLICATION_CREDENTIALS: /tmp/gcp-sa-key.json

default:
  retry:
    max: 2
    when:
      - runner_system_failure
      - api_failure
      - stuck_or_timeout_failure
      - scheduler_failure
      - unknown_failure
  interruptible: true
  image: $CI_IMAGE
  tags:
    - gke-linux-amd64-small

.tf-creds:
  before_script:
    - printf '%s' "$GOOGLE_CREDENTIALS" | base64 -d > "$GOOGLE_APPLICATION_CREDENTIALS"
    - test -s "$GOOGLE_APPLICATION_CREDENTIALS" || { echo "decoded SA key is empty — check GOOGLE_CREDENTIALS var"; exit 1; }
    - unset GOOGLE_CREDENTIALS

#[why] before plan, not after apply: this repo publishes its own GRP_KO_VAR_IAC_REF, so the tag has
#   to exist before terraform reads it. tag-mint.zsh exits 0 when HEAD is already tagged, so a re-run
#   mints nothing
tag-mint:
  stage: release
  needs: []
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  variables:
    GIT_DEPTH: "0"
    TAG_TOKEN: $REPO_VAR_TAG_TOKEN
  script:
    - make tag-mint
    #[why] resolved from the remote like semver-bump.zsh does, never `git describe`: the other jobs
    #   set no GIT_DEPTH, and a shallow clone can walk past the tag. `sort -V` is a true version sort
    - IAC_TAG=$(git ls-remote --tags origin 'v[0-9]*' | awk -F/ '{print $NF}' | grep -v '\^{}' | sort -V | tail -1)
    - test -n "$IAC_TAG" || { echo "no v* tag on origin after tag-mint"; exit 1; }
    - printf 'TF_VAR_iac_ref=%s\n' "$IAC_TAG" > iac-ref.env
  artifacts:
    reports:
      dotenv: iac-ref.env

validate-pre-commit-all:
  stage: validate
  rules:
    - if: $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH
  before_script:
    - export PROSE_ASSETS_REF=$(sed -n 's/^PROSE_ASSETS_REF *= *"\(.*\)"/\1/p' tf/*.tfvars)
    - export PROSE_SPEC_REF=$(sed -n 's/^PROSE_SPEC_REF *= *"\(.*\)"/\1/p' tf/*.tfvars)
    - export MISC_REF=$(sed -n 's/^MISC_REF *= *"\(.*\)"/\1/p' tf/*.tfvars)
  script:
    - make repo-ci-precommit-all
    - git diff --exit-code HEAD

plan:
  extends: .tf-creds
  stage: plan
  needs: []
  interruptible: false
  resource_group: terraform
  rules:
    - if: $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH
  script:
    #[why] branch pipelines never run tag-mint, so nothing hands them TF_VAR_iac_ref: resolve the
    #   current tag so the plan shows this repo's pin unchanged rather than failing on a missing var
    - export TF_VAR_iac_ref=$(git ls-remote --tags origin 'v[0-9]*' | awk -F/ '{print $NF}' | grep -v '\^{}' | sort -V | tail -1)
    - make plan
  artifacts:
    paths:
      - tf/plan.tfplan
    expire_in: 1 day

apply:
  extends: .tf-creds
  stage: apply
  needs:
    - tag-mint
  interruptible: false
  resource_group: terraform
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - make plan
    - make apply
    - ci/changed-ci-vars.zsh automation-event.env
  artifacts:
    reports:
      dotenv: automation-event.env

trigger-automation:
  extends: .TriggerAutomation
  stage: trigger
  needs:
    - apply
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
