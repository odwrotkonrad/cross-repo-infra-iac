##[>] 🤖🤖
workflow:
  rules:
    - if: $CI_COMMIT_BRANCH

stages:
  - validate
  - plan
  - apply

variables:
  CI_IMAGE: registry.gitlab.com/konradodwrot/infra/oci-images/ci-linux:latest
  TF_IN_AUTOMATION: "true"
  GITLAB_TOKEN: $TF_GITLAB_TOKEN
  TF_VAR_github_token: $GITHUB_TOKEN
  TF_VAR_ci_gitlab_token: $TF_GITLAB_TOKEN
  TF_VAR_ci_google_credentials: $GOOGLE_CREDENTIALS
  GOOGLE_APPLICATION_CREDENTIALS: /tmp/gcp-sa-key.json

default:
  retry:
    max: 2
    when:
      - runner_system_failure
      - api_failure
      - stuck_or_timeout_failure
      - scheduler_failure
      - unknown_failure
  interruptible: true
  image: $CI_IMAGE
  tags:
    - gke-linux-amd64

.tf-creds:
  before_script:
    - printf '%s' "$GOOGLE_CREDENTIALS" | base64 -d > "$GOOGLE_APPLICATION_CREDENTIALS"
    - test -s "$GOOGLE_APPLICATION_CREDENTIALS" || { echo "decoded SA key is empty — check GOOGLE_CREDENTIALS var"; exit 1; }
    - unset GOOGLE_CREDENTIALS

validate-pre-commit-all:
  stage: validate
  tags:
    - gke-linux-amd64-small
  rules:
    - if: $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH
  variables:
    CHE_RENDER_TEMPLATES_SKIP_SECRETS: "true"
  script:
    - make repo-ci-precommit-all
    - git diff --exit-code HEAD

plan:
  extends: .tf-creds
  stage: plan
  needs: []
  interruptible: false
  rules:
    - if: $CI_COMMIT_BRANCH
  script:
    - make plan
  artifacts:
    paths:
      - tf/plan.tfplan
    expire_in: 1 day

apply:
  extends: .tf-creds
  stage: apply
  needs:
    - plan
  interruptible: false
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - make apply
##[<] 🤖🤖
