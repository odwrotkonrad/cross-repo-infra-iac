# yaml-language-server: $schema=https://gitlab.com/konradodwrot/go-modules/-/raw/main/che/assets/data/che.schema.json
##[>] 🤖🤖
#[why] this repo's apply is what publishes these pins, so the env seed that precedes the first apply
#   cannot read them yet: default to main here rather than at each source, keeping the pins one line
#   each. a real value from .env or the process env still wins
env:
  CONFIGS_REF: ${{ env.CONFIGS_REF || main }}
  MISC_REF: ${{ env.MISC_REF || main }}

ontoRepo:
  options:
    autoDiscover: true
  include:
    profiles:
      - bootstrapCrossRepoCI
    renderTemplates:
      - source: "git::gitlab.com/konradodwrot/cross-repo/prose/spec@${{ env.PROSE_SPEC_REF }}"
        options:
          skipAutoGeneratedHeader: true
        <<<:
          - source: //conventions/conventions.md
            dest: assets/data/conventions.md
      - source: "git::gitlab.com/konradodwrot/cross-repo/prose/assets@${{ env.PROSE_ASSETS_REF }}"
        options:
          skipAutoGeneratedHeader: true
        <<<:
          - source: //repos/cross-repo/infra/iac/purpose.md
            dest: assets/docs-agents/purpose.md
          - source: //shared/license/LICENSE
            dest: LICENSE
          - dest: assets/data
            <<<:
              - source: //templates/2-data
                options:
                  skipAutoGeneratedHeader: false
                <<<:
                  - source: /makefile-agents.md.ontoRepo.tpl
                    dest: makefile.agents.md
                  - source: /repo-structure.md.ontoRepo.tpl
                    dest: repo-structure.md
          - source: //repos/cross-repo/infra/iac/templates/3-audience
            options:
              skipAutoGeneratedHeader: false
            <<<:
              - source: /README.md.ontoRepo.tpl
                dest: README.md
              - source: /AGENTS.md.ontoRepo.tpl
                dest:
                  - CLAUDE.md
                  - path: AGENTS.md
                    options:
                      renderReferencedFiles: true

claude-agents:
  options:
    autoDiscover: true
    runIf:
      - builtin:isVirt
  include:
    profiles:
      - source: "git::https://gitlab.com/konradodwrot/configs@${{ env.CONFIGS_REF }}//profiles/llm/claude/che.yml::llm/claude/virt"
        ctx:
          repo: Infra

#[why] the repo declares the toolchain its dependency step needs, so no host or image has to carry
#   terraform in advance for this repo to prepare
devEnv:
  include:
    installPackages:
      - terraform

bootstrapCrossRepoCI:
  include:
    profiles:
      - source: "git::https://gitlab.com/konradodwrot/cross-repo/misc@${{ env.MISC_REF }}//che.yml::bootstrapCrossRepoCITagging"

envSeed:
  include:
    renderTemplates:
      - source: .env.tpl
        dest:
          - path: .env
            options:
              writeType: mergeUpsert


